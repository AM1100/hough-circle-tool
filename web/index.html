<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>圆 · 霍夫圆检测工具</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#17263c;font:15px system-ui,sans-serif}header{padding:24px 5%;background:#152941;color:white}header h1{margin:0;font-size:26px}header p{color:#b9cce1;margin:8px 0 0}main{max-width:1400px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:280px 1fr;gap:22px}.panel{background:white;border:1px solid #dbe2eb;border-radius:14px;padding:20px}h2{font-size:17px;margin:0 0 16px}button,.download{border:0;border-radius:8px;padding:11px 15px;background:#e9eff8;color:#174873;font:inherit;cursor:pointer}button:disabled,.download[aria-disabled=true]{opacity:.45;cursor:default;pointer-events:none}.primary{background:#1765bf;color:white;width:100%;margin-top:18px}label{display:block;margin-top:12px;color:#47566b;font-size:13px}input[type=number]{width:100%;padding:8px;border:1px solid #ccd6e3;border-radius:6px;margin-top:4px;font:inherit}input[type=file]{max-width:100%;font-size:12px;margin:12px 0}.samples{display:flex;gap:8px;flex-wrap:wrap}.samples button{font-size:13px;padding:8px}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px}.image-box{min-height:280px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#f8fafc 0% 25%,#f0f3f7 0% 50%) 0/22px 22px;border-radius:9px;overflow:hidden}.image-box img{max-width:100%;max-height:470px;object-fit:contain}.empty{padding:35px;text-align:center;color:#708096}figure{margin:0}figcaption{font-size:13px;font-weight:600;margin-bottom:10px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.download{text-decoration:none;background:#1765bf;color:white;font-size:14px}.status{padding:13px 16px;border-radius:8px;background:#eaf2fc;line-height:1.6;margin-top:18px}.error{background:#fff0ec;color:#a63121}table{width:100%;border-collapse:collapse;margin-top:18px;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8edf3;font-size:13px}.hint{font-size:12px;color:#697a8f;line-height:1.7}.meta{font-size:13px;color:#63758c;overflow-wrap:anywhere}details{margin-top:16px}summary{cursor:pointer} @media(max-width:850px){main{grid-template-columns:1fr}.views{grid-template-columns:1fr}header{padding:20px 24px}.image-box{min-height:180px}}
</style>
<header><h1>圆 · 霍夫圆检测</h1><p>导入图片，调整参数，看清每一个圆。</p></header>
<main><aside class="panel"><h2>1 / 选择图片</h2><label for="file">导入 JPG / JPEG / PNG</label><input id="file" type="file" accept="image/jpeg,image/png"><div class="samples"><button id="coins">硬币样例</button><button id="plate">饼干盘样例</button></div><p class="hint">样例按钮会同时载入对应验收参数。自己的图片需按尺寸重新调参。</p><h2 style="margin-top:24px">2 / 调整参数</h2><form id="params">
<label>分辨率比例 dp<input name="dp" type="number" value="1" min="1" max="8" step="0.1" required></label>
<label>最小圆心距离 minDist / px<input name="min_dist" type="number" value="250" min="1" max="10000" required></label>
<label>边缘阈值 param1<input name="param1" type="number" value="100" min="1" max="1000" required></label>
<label>累加器阈值 param2<input name="param2" type="number" value="35" min="1" max="1000" required></label>
<label>最小半径 / px<input name="min_radius" type="number" value="165" min="0" max="9999" required></label>
<label>最大半径 / px<input name="max_radius" type="number" value="190" min="1" max="10000" required></label>
<label>中值滤波核（奇数，1 为关闭）<input name="blur" type="number" value="5" min="1" max="11" step="2" required></label>
<button id="detect" class="primary" type="submit" disabled>检测圆</button></form><details class="hint"><summary>如何调参</summary>先按目标大小限制半径范围，再调 param2：降低会检出更多候选圆，提高可减少误检。minDist 用于抑制相邻重复圆。所有长度均为原图像素。图片只在本机处理。</details></aside>
<section class="panel"><div class="toolbar"><div><h2 style="margin-bottom:6px">3 / 预览与导出</h2><div id="meta" class="meta">尚未导入图片</div></div><a id="export" class="download" aria-disabled="true" download="circles.png">导出标注 PNG</a></div><div class="views"><figure><figcaption>原始图片</figcaption><div class="image-box"><img id="original" alt="原图" hidden><div id="empty" class="empty">导入图片或选择一个样例开始</div></div></figure><figure><figcaption>检测结果 · 绿圈外缘 / 红点圆心</figcaption><div class="image-box"><img id="result" alt="圆检测标注结果" hidden><div id="pending" class="empty">检测后将在这里显示结果</div></div></figure></div><div id="status" class="status" role="status">等待导入图片</div><table id="table" hidden><thead><tr><th>圆编号</th><th>圆心 x / px</th><th>圆心 y / px</th><th>半径 / px</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script>
const $=id=>document.getElementById(id), form=$('params');let data='',filename='',revision=0,busy=false;
function status(message,error=false){$('status').textContent=message;$('status').className='status'+(error?' error':'')}
function invalidate(){revision++;$('export').removeAttribute('href');$('export').setAttribute('aria-disabled','true');$('result').hidden=true;$('pending').hidden=false;$('table').hidden=true;$('rows').replaceChildren()}
function loadImage(url,name){invalidate();data=url.split(',')[1];filename=name;$('original').src=url;$('original').hidden=false;$('empty').hidden=true;$('meta').textContent=name;$('detect').disabled=busy;status('图片已导入，点击「检测圆」查看结果')}
function readBlob(blob){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)})}
$('file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;if(file.size>16*1024*1024){status('图片需小于 16 MiB',true);return}loadImage(await readBlob(file),file.name)});
async function sample(name){try{const response=await fetch('/examples/'+name+'.jpg');if(!response.ok)throw Error('样例读取失败');const presets=await(await fetch('/api/presets')).json();for(const [key,value] of Object.entries(presets[name]))form.elements[key].value=value;loadImage(await readBlob(await response.blob()),name+'.jpg')}catch(error){status(error.message,true)}}
$('coins').onclick=()=>sample('coins');$('plate').onclick=()=>sample('cookie-plate');
form.addEventListener('input',()=>{invalidate();if(data)status('参数已改变，请重新检测后导出')});
form.addEventListener('submit',async event=>{event.preventDefault();if(!data||busy)return;invalidate();const version=revision;busy=true;$('detect').disabled=true;status('正在检测…');const parameters=Object.fromEntries([...new FormData(form)].map(([key,value])=>[key,Number(value)]));try{const response=await fetch('/api/detect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:data,parameters})});const result=await response.json();if(version!==revision)return;if(!response.ok)throw Error(result.error||'检测失败');const url='data:image/png;base64,'+result.image;$('result').src=url;$('result').hidden=false;$('pending').hidden=true;$('export').href=url;$('export').download=filename.replace(/\.[^.]+$/,'')+'-annotated.png';$('export').setAttribute('aria-disabled','false');$('meta').textContent=filename+' · '+result.width+' × '+result.height+' px';for(const [i,circle] of result.circles.entries()){const tr=document.createElement('tr');for(const value of [i+1,circle.x,circle.y,circle.radius]){const td=document.createElement('td');td.textContent=value;tr.append(td)}$('rows').append(tr)}$('table').hidden=!result.count;status('检测完成：'+result.count+' 个圆。'+(result.count?'可导出完整分辨率标注图。':'可调整半径范围或降低 param2 后重试。'))}catch(error){if(version===revision)status(error.message,true)}finally{busy=false;$('detect').disabled=!data}});
</script></html>
